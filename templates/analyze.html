{% extends "base.html" %}

{% block title %}Analyze Data{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3><i class="bi bi-funnel-fill"></i> Analyze Data</h3>
            </div>
            <div class="card-body">
                <form method="POST" class="row g-3">
                    <!-- Search Bar -->
                    <div class="col-12">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" name="search_query" 
                                   placeholder="Search across all columns...">
                        </div>
                    </div>
                    
                    <!-- Gender Multi-select -->
                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="genders" value="Male" id="maleCheck">
                            <label class="form-check-label" for="maleCheck">Male</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="genders" value="Female" id="femaleCheck">
                            <label class="form-check-label" for="femaleCheck">Female</label>
                        </div>
                    </div>
                    
                    <!-- Age Range -->
                    <div class="col-md-4">
                        <label class="form-label">Age Range</label>
                        <div class="input-group">
                            <input type="number" class="form-control" name="age_min" placeholder="Min" min="0">
                            <span class="input-group-text">to</span>
                            <input type="number" class="form-control" name="age_max" placeholder="Max" min="0">
                        </div>
                    </div>
                    
                    <!-- Profession Multi-select -->
                    <div class="col-md-4">
                        <label class="form-label">Profession</label>
                        <select class="form-select" name="professions" multiple>
                            {% for profession in professions %}
                            <option value="{{ profession }}">{{ profession }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <!-- Marital Status -->
                    <div class="col-md-4">
                        <label class="form-label">Marital Status</label>
                        <select class="form-select" name="ever_married">
                            <option value="">All</option>
                            <option value="Yes">Married</option>
                            <option value="No">Not Married</option>
                        </select>
                    </div>
                    
                    <!-- Graduated -->
                    <div class="col-md-4">
                        <label class="form-label">Graduated</label>
                        <select class="form-select" name="graduated">
                            <option value="">All</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    
                    <!-- Spending Score Multi-select -->
                    <div class="col-md-4">
                        <label class="form-label">Spending Score</label>
                        <select class="form-select" name="spending_scores" multiple>
                            {% for score in spending_scores %}
                            <option value="{{ score }}">{{ score }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <!-- Family Size Range -->
                    <div class="col-md-4">
                        <label class="form-label">Family Size Range</label>
                        <div class="input-group">
                            <input type="number" class="form-control" name="family_size_min" placeholder="Min" min="1">
                            <span class="input-group-text">to</span>
                            <input type="number" class="form-control" name="family_size_max" placeholder="Max" min="1">
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-funnel"></i> Apply Filters
                        </button>
                        <button type="reset" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise"></i> Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Enable multi-select functionality
document.addEventListener('DOMContentLoaded', function() {
    $('select[multiple]').select2({
        placeholder: "Select options",
        width: '100%'
    });
});
</script>
{% endblock %}
